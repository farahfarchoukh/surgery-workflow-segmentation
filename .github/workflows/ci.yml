name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Provision Python 3.12 + dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check .

      - name: Pre-commit hooks (same ruff checks, proves the hooks actually run)
        run: .venv/bin/python -m pre_commit run --all-files --show-diff-on-failure

      - name: Run test suite with coverage
        run: .venv/bin/python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Smoke-test the full pipeline (train -> evaluate -> error-analysis)
        run: |
          .venv/bin/python -m src.train
          .venv/bin/python -m src.evaluate
          .venv/bin/python -m src.error_analysis

      - name: Upload run logs
        if: always()  # logs are most useful exactly when a prior step failed
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: outputs/logs/
          if-no-files-found: ignore

  security:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Provision Python 3.12 + exactly the locked runtime dependencies
        run: |
          uv venv --python 3.12
          # --index-strategy unsafe-best-match: some pinned CVE-fix versions (e.g. idna>=3.7)
          # only exist on PyPI, not on the PyTorch CPU wheel index also listed in
          # requirements-lock.txt - same reasoning as the Dockerfile's install step, see
          # its comment for why a single-index default would fail to resolve these.
          uv pip install --index-strategy unsafe-best-match -r requirements-lock.txt
          uv pip install pip-audit

      - name: Audit the exact dependency set the Docker image ships
        run: .venv/bin/pip-audit

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t surgery-workflow-segmentation:ci .

      - name: Start container and check /health
        run: |
          docker run -d --name smoke -p 8000:8000 surgery-workflow-segmentation:ci
          # No checkpoint is baked into the image (outputs/ is gitignored/
          # dockerignored) or mounted here, so this deliberately exercises
          # the graceful-degradation path (Sec 4.4/README): /health must
          # still respond with status "degraded", not fail to come up at all.
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "degraded" || (echo "expected degraded status with no checkpoint mounted" && exit 1)

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs smoke || true

      - name: Stop container
        if: always()
        run: docker stop smoke || true

  report:
    name: Build technical architecture report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Provision Python 3.12 + dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt

      - name: Render diagram + build PDF
        run: |
          .venv/bin/python scripts/make_report_assets.py
          .venv/bin/python report/build_pdf.py

      - name: Upload report PDF
        uses: actions/upload-artifact@v4
        with:
          name: technical-architecture-report
          path: report/technical_architecture_report.pdf
