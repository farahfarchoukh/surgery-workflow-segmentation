[project]
name = "surgery-workflow-segmentation"
version = "0.1.0"
description = "OR workflow phase segmentation prototype - Proximie Senior ML Engineer take-home"
requires-python = ">=3.12"

[tool.ruff]
# 130, not the default 88/100: this codebase deliberately writes longer
# explanatory comments/docstrings (the WHY behind non-obvious decisions,
# per project convention) rather than wrapping them into short fragments -
# see README/report for why that verbosity is intentional here.
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "N812",  # `import torch.nn.functional as F` is the universal PyTorch convention, not a real naming problem
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# Not gated at 100% - error_analysis.py's __main__ block and a few CLI
# entry points are exercised manually (make train/evaluate), not under
# pytest. The number is reported honestly in CI rather than hidden or
# gamed with a fail-under threshold that would just get lowered later.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
